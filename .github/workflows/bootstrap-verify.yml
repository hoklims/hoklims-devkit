name: Diagnose tested native preflight

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Exact failed release run containing the tested tarball
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install tested agent CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.229
      - name: Download and diagnose exact failed release tarball
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          set -euo pipefail
          test "$VERIFIED_RUN_ID" = "37465894823"
          mkdir -p diagnostic-output
          gh run download "$VERIFIED_RUN_ID" --repo hoklims/hoklims-devkit --name tested-npm-tarball --dir tested-package
          tarball="tested-package/hoklims-devkit-0.1.1.tgz"
          test -f "$tarball"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const digest=crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex");if(digest!=="c8d4d1ae0ea18b1361e387a4525a0f468622ea046c626a2c7554b8c8a267b265")throw new Error("diagnostic tarball SHA256 mismatch")' "$tarball"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts "$PWD/$tarball"
          set +e
          bun scripts/release-smoke-diagnostic.js "$consumer" > diagnostic-output/stdout.log 2> diagnostic-output/stderr.log
          result=$?
          set -e
          printf '%s\n' "$result" > diagnostic-output/exit-code.txt
          exit "$result"
      - name: Preserve safe diagnostic outputs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-preflight-diagnostic-${{ matrix.os }}
          path: diagnostic-output/*
          if-no-files-found: warn
