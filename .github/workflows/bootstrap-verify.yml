name: Diagnose native candidate 0.1.3
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen candidate, diagnostic only
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 09adbfeb383a3322c8f5aa1f6c7cb75f375ff750
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - id: package
        name: Build one diagnostic candidate tarball, no admission or publication
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "09adbfeb383a3322c8f5aa1f6c7cb75f375ff750"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(node -p 'require("./package.json").version')" = "0.1.3"
          bun build ./bin/hoklims-devkit.js --target=bun --outdir=dist
          tarball="$(npm pack --silent)"
          test "$tarball" = "hoklims-devkit-0.1.3.tgz"
          digest="$(node -e 'const fs=require("node:fs"),c=require("node:crypto");process.stdout.write(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$tarball")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          printf 'DIAGNOSTIC_SOURCE_SHA=%s\nDIAGNOSTIC_SOURCE_TREE=%s\nDIAGNOSTIC_TARBALL_SHA256=%s\n' "$CANDIDATE_SHA" "$(git rev-parse 'HEAD^{tree}')" "$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-native-tarball
          path: hoklims-devkit-0.1.3.tgz
          if-no-files-found: error
  verify:
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 09adbfeb383a3322c8f5aa1f6c7cb75f375ff750
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install tested agent CLIs, metadata and plugin compatibility only
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.229
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-native-tarball
          path: tested-package
      - name: Diagnose unchanged native release smoke on identical candidate bytes
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "09adbfeb383a3322c8f5aa1f6c7cb75f375ff750"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(node -p 'require("./package.json").version')" = "0.1.3"
          tarball="tested-package/hoklims-devkit-0.1.3.tgz"
          node -e 'const fs=require("node:fs"),c=require("node:crypto");if(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex")!==process.env.EXPECTED_SHA256)throw new Error("candidate diagnostic tarball hash differs")' "$tarball"
          mkdir -p diagnostic-output
          printf 'DIAGNOSTIC_ONLY_NO_ADMISSION\nSOURCE_SHA=%s\nSOURCE_TREE=%s\nTARBALL_SHA256=%s\n' "$CANDIDATE_SHA" "$(git rev-parse 'HEAD^{tree}')" "$EXPECTED_SHA256" > diagnostic-output/source-metadata.txt
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts "$PWD/$tarball"
          set +e
          bun scripts/release-smoke.js "$consumer" > diagnostic-output/stdout.log 2> diagnostic-output/stderr.log
          result=$?
          set -e
          printf '%s\n' "$result" > diagnostic-output/exit-code.txt
          exit "$result"
      - name: Retain diagnostic metadata and smoke stdout/stderr only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-native-diagnostic-${{ matrix.os }}
          path: diagnostic-output/*
          if-no-files-found: warn
