name: Verify npm bootstrap release

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Tag workflow run whose tested npm tarball was published
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v0.1.0
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.12.5
          enable-cache: false
      - name: Install tested agent CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.229 # zizmor: ignore[adhoc-packages] exact host smoke pins
      - name: Verify the published bootstrap package and its exact tag # zizmor: ignore[adhoc-packages] exact registry package is the subject under test
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          [[ "$VERIFY_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(git cat-file -t refs/tags/v0.1.0)" = "tag"
          test "$(git rev-list -n 1 refs/tags/v0.1.0)" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test "$(node -p 'require("./package.json").version')" = "0.1.0"
          run_json="$(gh run view "$VERIFY_RUN_ID" --repo hoklims/hoklims-devkit --json workflowName,headSha,event,conclusion)"
          test "$(jq -r '.workflowName' <<< "$run_json")" = "Publish npm release"
          test "$(jq -r '.headSha' <<< "$run_json")" = "$(git rev-parse HEAD)"
          test "$(jq -r '.event' <<< "$run_json")" = "push"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"
          gh run download "$VERIFY_RUN_ID" --repo hoklims/hoklims-devkit --name tested-npm-tarball --dir tested-package
          tarball="tested-package/hoklims-devkit-0.1.0.tgz"
          test -f "$tarball"
          integrity="sha512-$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
          test "$(npm view hoklims-devkit@0.1.0 version)" = "0.1.0"
          test "$(npm view hoklims-devkit@0.1.0 dist.integrity)" = "$integrity"
          bun run check
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts hoklims-devkit@0.1.0 # zizmor: ignore[adhoc-packages] verify exact public bootstrap
          bun scripts/release-smoke.js "$consumer"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v0.1.0
          persist-credentials: false
      - name: Create GitHub release after public registry verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: hoklims/hoklims-devkit
        run: gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --verify-tag --generate-notes
