name: Publish npm release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.12.5
          enable-cache: false
      - name: Install tested agent CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.229 # zizmor: ignore[adhoc-packages] exact host smoke pins
      - name: Verify release identity and local package # zizmor: ignore[adhoc-packages] exact local tarball and pinned host CLIs are the subjects under test
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          git merge-base --is-ancestor HEAD origin/main
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
          bun run check
          tarball="$(npm pack --silent)"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts "$PWD/$tarball" # zizmor: ignore[adhoc-packages] test exact local tarball outside checkout
          bun scripts/release-smoke.js "$consumer"
      - name: Preserve the tested Linux tarball
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-npm-tarball
          path: hoklims-devkit-*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-npm-tarball
          path: tested-package
      - name: Publish exact tag through npm trusted publishing # zizmor: ignore[adhoc-packages] exact npm publisher pin is required for OIDC
        shell: bash
        run: |
          npm install --global npm@11.5.1 # zizmor: ignore[adhoc-packages] exact OIDC publisher pin
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          git merge-base --is-ancestor HEAD origin/main
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
          bun run check
          version="$(node -p 'require("./package.json").version')"
          tarball="tested-package/hoklims-devkit-${version}.tgz"
          test -f "$tarball"
          if npm view "hoklims-devkit@$version" version >/dev/null 2>&1; then
            existing="$(npm view "hoklims-devkit@$version" gitHead)"
            test -n "$existing"
            test "$existing" = "$(git rev-parse HEAD)"
          else
            npm publish "$tarball" --access public
          fi
          test "$(npm view "hoklims-devkit@$version" version)" = "$version"
  public-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.12.5
          enable-cache: false
      - name: Install tested agent CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.229 # zizmor: ignore[adhoc-packages] exact host smoke pins
      - name: Verify public registry install and both host dry-runs # zizmor: ignore[adhoc-packages] exact public release is the subject under test
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts "hoklims-devkit@$version" # zizmor: ignore[adhoc-packages] verify exact public release
          bun scripts/release-smoke.js "$consumer"

  release:
    needs: public-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create GitHub release after registry verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
