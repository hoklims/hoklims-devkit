name: Publish npm release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - id: package
        name: Build one release tarball from the annotated main tag
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          test "$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          bun run check
          tarball="$(npm pack --silent)"
          test "$tarball" = "hoklims-devkit-${version}.tgz"
          digest="$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$tarball")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Preserve the one tested and published tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-npm-tarball
          path: hoklims-devkit-*.tgz
          if-no-files-found: error

  verify:
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.13'
      - name: Install tested agent CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.229 # zizmor: ignore[adhoc-packages] exact host smoke pins
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-npm-tarball
          path: tested-package
      - name: Verify the identical release tarball and both host integrations # zizmor: ignore[adhoc-packages] exact prebuilt tarball and pinned host CLIs are the subjects under test
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          git merge-base --is-ancestor HEAD origin/main
          test "${GITHUB_REF_NAME}" = "v$RELEASE_VERSION"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          bun run check
          tarball="tested-package/hoklims-devkit-${RELEASE_VERSION}.tgz"
          test -f "$tarball"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const actual=crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex");if(actual!==process.env.EXPECTED_SHA256)throw new Error("tested tarball digest mismatch")' "$tarball"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts "$PWD/$tarball" # zizmor: ignore[adhoc-packages] test exact local tarball outside checkout
          bun scripts/release-smoke.js "$consumer"

  publish:
    needs: [build, verify]
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-npm-tarball
          path: tested-package
      - name: Publish exact tag through npm trusted publishing # zizmor: ignore[adhoc-packages] exact npm publisher pin is required for OIDC
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          npm install --global npm@11.5.1 # zizmor: ignore[adhoc-packages] exact OIDC publisher pin
          version="$RELEASE_VERSION"
          test "$GITHUB_REF_NAME" = "v$version"
          tarball="tested-package/hoklims-devkit-${version}.tgz"
          test -f "$tarball"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto");const actual=crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex");if(actual!==process.env.EXPECTED_SHA256)throw new Error("published tarball digest mismatch")' "$tarball"
          integrity="sha512-$(node -e 'const fs=require("node:fs"),crypto=require("node:crypto");process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
          if npm view "hoklims-devkit@$version" version >/dev/null 2>&1; then
            test "$(npm view "hoklims-devkit@$version" dist.integrity)" = "$integrity"
          else
            npm publish "$tarball" --access public
          fi
          test "$(npm view "hoklims-devkit@$version" version)" = "$version"
          test "$(npm view "hoklims-devkit@$version" dist.integrity)" = "$integrity"
  public-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.13'
      - name: Install tested agent CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.229 # zizmor: ignore[adhoc-packages] exact host smoke pins
      - name: Verify public registry install and both host dry-runs # zizmor: ignore[adhoc-packages] exact public release is the subject under test
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts "hoklims-devkit@$version" # zizmor: ignore[adhoc-packages] verify exact public release
          bun scripts/release-smoke.js "$consumer"

  release:
    needs: public-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create GitHub release after registry verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
