name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.15.0
      - run: bun run check
      - name: Test packaged CLI outside checkout
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts "$PWD/$tarball"
          bun "$consumer/node_modules/hoklims-devkit/bin/hoklims-devkit.js" --help
          test "$(bun "$consumer/node_modules/hoklims-devkit/bin/hoklims-devkit.js" --version)" = "$(node -p 'require("./package.json").version')"
